<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career LaunchPAD widget — handoff preview</title>
  <!--
    Career LaunchPAD widget — handoff to myBlueprint.

    Integration notes for React-wrapping:
    1. Extract this <style> block into a real stylesheet (LESS file or imported .css).
       Leaving it inline will cause stylesheet churn on every React re-render in the
       host app's older React version.
    2. Move the JS init into useEffect (or componentDidMount) inside the React
       component. Do NOT leave it as a top-of-render IIFE — listeners will stack
       duplicates on every re-render and the scroll handler will fire on phantom nodes.
    3. All classes are namespaced .cl-* — safe to drop into the host app's global LESS
       without collision.
    4. All three href values include UTM parameters
       (utm_source=myblueprint, utm_medium=widget, utm_campaign=career-launchpad-v1,
       utm_content=<slot>). Ampersands between query params are encoded as
       &amp; in attribute values for HTML validity. The QR's encoded URL also
       includes the UTMs so phone-handoff sessions attribute to GA4.
    5. Thumbnails ship as files in this directory's assets/ folder. The handoff
       bundle includes assets/thumb-1.png and assets/thumb-2.png. On integration,
       upload both to the myBlueprint CDN and replace the two <img src> values
       (and only those two) with the CDN URLs.
    6. Every <button> has type="button" — keeps the widget safe inside any
       ancestor <form> in the host dashboard.
    7. URL construction uses URLSearchParams, not raw concatenation. See
       CONTENT.md for the computed final hrefs. The launchpad's deep links use
       ?content=slug today, so blind ?utm_source=... appending would produce
       broken URLs.
    8. Color values are pulled from DESIGN.md tokens (Anchor Navy #22224c,
       Slate Ink #485163, Studio Off-White #f6f6ff, Slate-Frame-Light #e5e9f1,
       Signal Blue #0092ff). Update tokens here when DESIGN.md updates.
  -->
  <style>
    /* === Reset within widget scope === */
    .cl-widget,
    .cl-widget *,
    .cl-widget *::before,
    .cl-widget *::after {
      box-sizing: border-box;
    }
    .cl-widget ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .cl-widget a {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .cl-widget button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    /* === Section container ===
       Color tokens map to DESIGN.md:
         #ffffff   = pure-white
         #22224c   = anchor-navy
         #485163   = slate-ink
         #65738b   = slate-body
         #aab7cb   = slate-echo
         #e5e9f1   = slate-frame-light
         #f6f6ff   = studio-off-white
         #0092ff   = signal-blue
         #0082e5   = signal-blue-deep                                          */
    .cl-widget {
      position: relative;                /* anchors absolutely-positioned mobile arrows */
      background: #ffffff;
      border: 1px solid #e5e9f1;
      border-radius: 16px;
      box-shadow: 0 4px 6px rgba(34, 34, 76, 0.10);
      padding: 24px;
      font-family: 'Open Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #22224c;                    /* anchor-navy */
      max-width: 1200px;
      margin: 0 auto;
      container-type: inline-size;
      container-name: clw;
      --cl-card-aspect: 16 / 9;
      --cl-max-height: none;
      --cl-min-card-width: 220px;
      max-height: var(--cl-max-height);
      overflow: hidden;
    }

    /* === Header === */
    .cl-widget__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    .cl-widget__header-text {
      flex: 1;
      min-width: 0;
    }
    .cl-widget__header h2 {
      margin: 0 0 4px 0;
      font-size: clamp(18px, 1.5cqi + 12px, 24px);
      font-weight: 900;
      letter-spacing: -0.005em;
      line-height: 1.3;
      color: #22224c;                    /* anchor-navy */
    }
    .cl-widget__header h2 .cl-widget__brand-mark {
      display: inline-block;
      background: #0092ff;
      color: #ffffff;
      padding: 0 8px;
      border-radius: 4px;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }
    .cl-widget__header p {
      margin: 0;
      font-size: clamp(14px, 1cqi + 10px, 16px);
      color: #485163;                    /* slate-ink */
      line-height: 1.45;
    }

    .cl-widget a.cl-widget__more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 600;
      background: #0092ff;
      color: #ffffff;
      border: 1px solid #0092ff;
      border-radius: 999px;
      white-space: nowrap;
      transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .cl-widget a.cl-widget__more:hover {
      background: #ffffff;
      color: #0092ff;
      border-color: rgba(0, 146, 255, 0.3);
    }
    .cl-widget__more:focus-visible {
      outline: 2px solid #0092ff;
      outline-offset: 2px;
    }

    /* === Track (desktop: 3-col grid) === */
    .cl-widget__track {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    /* === Card === */
    .cl-card {
      border-radius: 10px;
      overflow: hidden;
      background: #f6f6ff;               /* studio-off-white */
      border: 1px solid #e5e9f1;         /* slate-frame-light */
      transition: transform 150ms ease, box-shadow 150ms ease;
    }
    .cl-card a {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .cl-card img {
      width: 100%;
      aspect-ratio: var(--cl-card-aspect);
      object-fit: cover;
      display: block;
      background: #e5e9f1;               /* slate-frame-light placeholder while loading */
    }
    .cl-card--qr .cl-card__media {
      aspect-ratio: var(--cl-card-aspect);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;               /* pure-white for QR contrast */
      overflow: hidden;
    }
    .cl-card--qr .cl-card__media img {
      height: 100%;
      width: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      padding: 8px;
      background: #ffffff;
    }
    .cl-card__label {
      display: block;
      padding: 12px 14px 14px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* === Mobile-only controls hidden on desktop === */
    .cl-widget__controls {
      display: none;
    }

    /* === Visually hidden announcer === */
    .cl-sr-announce {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* === Layout switch: container-query path (Chrome 105+, Safari 16+, Firefox 110+) === */
    @supports (container-type: inline-size) {
      @container clw (max-width: 600px) {
        .cl-widget {
          padding: 20px 16px;
          border-radius: 14px;
        }

        .cl-widget__track {
          display: flex;
          grid-template-columns: none;
          gap: 0;
          overflow-x: auto;
          overflow-y: hidden;
          scroll-snap-type: x mandatory;
          scroll-behavior: smooth;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          margin: 0 -16px;
          padding: 0 16px;
        }
        .cl-widget__track::-webkit-scrollbar {
          display: none;
        }

        .cl-card {
          flex: 0 0 100%;
          scroll-snap-align: center;
          scroll-snap-stop: always;
        }

        /* Show controls on narrow container.
           The arrows overhang the card edges (matching the design mock); they are
           absolutely positioned and vertically centered against the card image
           area. The dots row sits below the card on its own line. */
        .cl-widget__controls {
          display: block;
          margin-top: 16px;
          text-align: center;
        }

        .cl-widget__controls .cl-arrow {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: #0092ff;             /* signal-blue */
          color: #ffffff;
          font-size: 20px;
          line-height: 1;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 2px 8px rgba(34, 34, 76, 0.18);
          z-index: 2;
          transition: opacity 120ms ease, background-color 120ms ease;
        }
        .cl-arrow--prev {
          left: -4px;                      /* overhangs the section's left edge */
        }
        .cl-arrow--next {
          right: -4px;                     /* overhangs the section's right edge */
        }
        .cl-arrow:hover:not([disabled]) {
          background: #0082e5;             /* signal-blue-deep */
        }

        .cl-dots {
          display: inline-flex;
          justify-content: center;
          gap: 8px;
        }
        .cl-widget__controls .cl-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #ffffff;
          border: 2px solid #0092ff;       /* signal-blue ring on white = "empty" state.
                                              Scoped under .cl-widget__controls so the
                                              specificity (0,2,0) beats the .cl-widget button
                                              reset at (0,1,1). */
          box-sizing: border-box;
          transition: background-color 120ms ease, width 120ms ease, border-color 120ms ease;
        }
      }

      /* === Narrow container (<380px) — stack the header View-more button below the text === */
      @container clw (max-width: 380px) {
        .cl-widget__header {
          flex-direction: column;
          align-items: stretch;
        }
        .cl-widget__more {
          align-self: flex-start;
        }
      }
    }

    /* === Layout switch: viewport-query fallback (older Safari without container query support) === */
    @supports not (container-type: inline-size) {
      /* === Mobile (<768px) === */
      @media (max-width: 767.98px) {
        .cl-widget {
          padding: 20px 16px;
          border-radius: 14px;
        }

        .cl-widget__track {
          display: flex;
          grid-template-columns: none;
          gap: 0;
          overflow-x: auto;
          overflow-y: hidden;
          scroll-snap-type: x mandatory;
          scroll-behavior: smooth;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
          margin: 0 -16px;
          padding: 0 16px;
        }
        .cl-widget__track::-webkit-scrollbar {
          display: none;
        }

        .cl-card {
          flex: 0 0 100%;
          scroll-snap-align: center;
          scroll-snap-stop: always;
        }

        /* Show controls on mobile.
           The arrows overhang the card edges (matching the design mock); they are
           absolutely positioned and vertically centered against the card image
           area. The dots row sits below the card on its own line. */
        .cl-widget__controls {
          display: block;
          margin-top: 16px;
          text-align: center;
        }

        .cl-widget__controls .cl-arrow {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          width: 36px;
          height: 36px;
          border-radius: 50%;
          background: #0092ff;             /* signal-blue */
          color: #ffffff;
          font-size: 20px;
          line-height: 1;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 2px 8px rgba(34, 34, 76, 0.18);
          z-index: 2;
          transition: opacity 120ms ease, background-color 120ms ease;
        }
        .cl-arrow--prev {
          left: -4px;                      /* overhangs the section's left edge */
        }
        .cl-arrow--next {
          right: -4px;                     /* overhangs the section's right edge */
        }
        .cl-arrow:hover:not([disabled]) {
          background: #0082e5;             /* signal-blue-deep */
        }

        .cl-dots {
          display: inline-flex;
          justify-content: center;
          gap: 8px;
        }
        .cl-widget__controls .cl-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: #ffffff;
          border: 2px solid #0092ff;       /* signal-blue ring on white = "empty" state.
                                              Scoped under .cl-widget__controls so the
                                              specificity (0,2,0) beats the .cl-widget button
                                              reset at (0,1,1). */
          box-sizing: border-box;
          transition: background-color 120ms ease, width 120ms ease, border-color 120ms ease;
        }
      }

      /* === Narrow mobile (<480px) — stack the header View-more button below the text === */
      @media (max-width: 479.98px) {
        .cl-widget__header {
          flex-direction: column;
          align-items: stretch;
        }
        .cl-widget__more {
          align-self: flex-start;
        }
      }
    }

    /* === States === */
    @media (hover: hover) {
      .cl-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.08);
      }
    }

    .cl-card a:focus-visible,
    .cl-arrow:focus-visible,
    .cl-dot:focus-visible {
      outline: 2px solid #0092ff;        /* signal-blue */
      outline-offset: 2px;
    }

    .cl-card a:active {
      opacity: 0.85;
      transition: opacity 80ms ease;
    }

    .cl-arrow[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .cl-dot[aria-pressed="true"] {
      background: #0092ff;               /* signal-blue */
      border-color: #0092ff;             /* ring vanishes into fill */
      width: 22px;
      border-radius: 4px;
    }

    /* === Reduced motion (CSS layer) === */
    @media (prefers-reduced-motion: reduce) {
      .cl-widget__track {
        scroll-behavior: auto;
      }
      .cl-card,
      .cl-arrow,
      .cl-dot {
        transition: none !important;
      }
      .cl-card:hover {
        transform: none;
      }
    }
  </style>
</head>

  <script>
    (function initClWidget() {
      const widget = document.querySelector('.cl-widget');
      if (!widget) return;
      const track     = widget.querySelector('.cl-widget__track');
      const cards     = widget.querySelectorAll('.cl-card');
      const dots      = widget.querySelectorAll('.cl-dot');
      const prev      = widget.querySelector('.cl-arrow--prev');
      const next      = widget.querySelector('.cl-arrow--next');
      const announcer = widget.querySelector('.cl-sr-announce');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let activeIndex = 0;

      function scrollBehavior() {
        return reduceMotion.matches ? 'auto' : 'smooth';
      }

      function cardCenterScroll(i) {
        // Center-align the card in the track so the result agrees with
        // CSS `scroll-snap-align: center`. Left-edge math would cause a
        // visible one-frame jitter as smooth-scroll lands at the left and
        // then snap re-centers.
        const trackRect  = track.getBoundingClientRect();
        const cardRect   = cards[i].getBoundingClientRect();
        const cardCenter  = cardRect.left + cardRect.width / 2;
        const trackCenter = trackRect.left + trackRect.width / 2;
        return track.scrollLeft + (cardCenter - trackCenter);
      }

      function goTo(i) {
        activeIndex = Math.max(0, Math.min(cards.length - 1, i));
        track.scrollTo({ left: cardCenterScroll(activeIndex), behavior: scrollBehavior() });
        dots.forEach(function (d, n) {
          d.setAttribute('aria-pressed', n === activeIndex ? 'true' : 'false');
        });
        prev.disabled = activeIndex === 0;
        next.disabled = activeIndex === cards.length - 1;
        announcer.textContent = 'Card ' + (activeIndex + 1) + ' of ' + cards.length;
      }

      prev.addEventListener('click', function () { goTo(activeIndex - 1); });
      next.addEventListener('click', function () { goTo(activeIndex + 1); });
      dots.forEach(function (d, i) {
        d.addEventListener('click', function () { goTo(i); });
      });

      // Sync state when the user drives the scroll via touch/swipe.
      let scrollTimer;
      track.addEventListener('scroll', function () {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function () {
          let nearest = 0;
          let nearestDist = Infinity;
          for (let n = 0; n < cards.length; n++) {
            const d = Math.abs(cardCenterScroll(n) - track.scrollLeft);
            if (d < nearestDist) { nearestDist = d; nearest = n; }
          }
          if (nearest !== activeIndex) goTo(nearest);
        }, 80);
      });

      // Viewport flip mobile → desktop: reset state without animation.
      window.addEventListener('resize', function () {
        if (window.matchMedia('(min-width: 768px)').matches) {
          track.scrollLeft = 0;
          activeIndex = 0;
          dots.forEach(function (d, n) {
            d.setAttribute('aria-pressed', n === 0 ? 'true' : 'false');
          });
          prev.disabled = true;
          next.disabled = false;
        }
      });

      goTo(0);
    })();
  </script>
</body>
</html>
